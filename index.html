<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>럭키마미 캐러셀 디자인</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캐러셀">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- pinned: the bare url 302s, which a service worker cache refuses to store -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brand: {
    50:'#F2F6F4', 100:'#E3EDE8', 200:'#C7DAD1', 300:'#A9C6B8',
    400:'#8FAF9D', 500:'#7A9C89', 600:'#648172', 700:'#4F675B', 800:'#3C4E45'
  } } } } };
</script>
<!-- the only font loaded up front. the other 19 are mounted the moment the picker opens -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  html,body{height:100%}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:rgba(0,0,0,.12);border-radius:9999px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:9999px;background:#404040}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:9999px;background:#404040}
  input[type=color]{-webkit-appearance:none;appearance:none;border:0;background:transparent;padding:0}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.15);border-radius:9999px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:9999px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.30);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  .pane{overflow-y:auto;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent}
  .seg{height:28px}
  .off{display:none !important}
  /* the phone address bar makes 100vh lie; dvh follows the visible box */
  #app{height:100vh;height:100dvh}
  /* dragging on the canvas must move the artwork, never scroll the page */
  #view{touch-action:none}
  body{overscroll-behavior:none}
  textarea{field-sizing:content}
  @media (max-width:1023px){
    .seg{height:32px}                       /* 28px is too small for a thumb */
    ::-webkit-scrollbar{width:0;height:0}
    .pane{scrollbar-width:none}
  }
  @media (hover:none){
    /* no hover on touch, so the pressed state has to carry the feedback */
    .seg:active{background:rgba(0,0,0,.10)}
  }
  .cbx input:checked + .box{background:rgba(0,0,0,.10)}
  .cbx input:checked + .box svg{opacity:1;color:#171717}
</style>
</head>
<body class="bg-white text-neutral-900 text-xs font-normal antialiased overflow-hidden">
<div id="app" class="flex flex-col">

  <!-- top bar -->
  <header class="border-b border-neutral-200 shrink-0">
    <div class="flex items-center justify-between h-12 lg:h-14 gap-2">
      <div class="flex items-center gap-2.5 pl-3 lg:pl-4 min-w-0">
        <button id="btnSheetLeft" class="lg:hidden size-7 shrink-0 grid place-items-center rounded-full hover:bg-neutral-200" data-ic="bars3" data-tone="icon" title="파일"></button>
        <div class="size-7 shrink-0 rounded-md bg-brand-400/20 grid place-items-center">
          <svg viewBox="0 0 16 16" fill="currentColor" class="size-4 text-brand-600"><path d="M3 4.75A1.75 1.75 0 0 1 4.75 3h6.5A1.75 1.75 0 0 1 13 4.75v6.5A1.75 1.75 0 0 1 11.25 13h-6.5A1.75 1.75 0 0 1 3 11.25v-6.5Zm1.5 0v6.5c0 .138.112.25.25.25h6.5a.25.25 0 0 0 .25-.25v-6.5a.25.25 0 0 0-.25-.25h-6.5a.25.25 0 0 0-.25.25Z"/></svg>
        </div>
        <div class="min-w-0">
          <p class="text-neutral-900 truncate leading-4">럭키마미 캐러셀 디자인</p>
          <p id="subTitle" class="text-neutral-9000 text-[11px] truncate leading-4"></p>
        </div>
        <span id="notice" class="text-amber-600 truncate hidden lg:inline pl-2"></span>
      </div>
      <div class="flex items-center gap-1 pr-3 lg:pr-4 shrink-0">
        <button id="btnUndo" class="seg px-2 rounded-full hover:bg-neutral-200 text-neutral-600 disabled:opacity-30" data-ic="undo" data-tone="icon" title="뒤로가기 ⌘Z"></button>
        <button id="btnRedo" class="seg px-2 rounded-full hover:bg-neutral-200 text-neutral-600 disabled:opacity-30" data-ic="redo" data-tone="icon" title="다시 ⇧⌘Z"></button>
        <span class="w-px h-4 bg-neutral-200 mx-1"></span>
        <button id="btnPreview" class="seg inline-flex items-center gap-1.5 px-3 rounded-full bg-neutral-100 hover:bg-neutral-200">
          <span data-ic="play" data-tone="icon"></span><span class="hidden sm:inline">미리보기</span>
        </button>
        <button id="btnDownload" class="seg inline-flex items-center gap-1.5 px-3 rounded-full bg-neutral-200 hover:bg-neutral-300">
          <span data-ic="download" data-tone="icon"></span><span id="dlLabel">다운로드</span>
        </button>
      </div>
    </div>
  </header>

  <!-- main -->
  <div class="flex-1 flex min-h-0">

    <!-- left icon rail -->
    <nav id="rail" class="hidden lg:flex flex-col w-12 shrink-0 border-r border-neutral-200 pt-2 gap-1 items-center"></nav>

    <!-- left panel -->
    <aside id="leftPane" class="hidden lg:block w-[248px] shrink-0 border-r border-neutral-200 pane"></aside>

    <!-- stage -->
    <section class="flex-1 flex flex-col min-w-0 min-h-0">
      <div id="stage" class="flex-1 min-h-0 relative overflow-hidden">
        <canvas id="view" class="absolute inset-0 w-full h-full block select-none"></canvas>

        <div id="viewBar" class="absolute top-3 left-3 flex items-center gap-1.5 pointer-events-auto">
          <div class="inline-flex seg items-center rounded-full bg-neutral-100" id="viewToggle"></div>
          <div class="inline-flex seg items-center rounded-full bg-neutral-100">
            <button id="btnZoomOut" class="size-7 grid place-items-center rounded-full hover:bg-neutral-200" data-ic="minus" data-tone="icon"></button>
            <button id="btnFit" class="px-2 h-7 rounded-full hover:bg-neutral-200 font-mono text-[11px] text-neutral-600">100%</button>
            <button id="btnZoomIn" class="size-7 grid place-items-center rounded-full hover:bg-neutral-200" data-ic="plus" data-tone="icon"></button>
          </div>
        </div>

        <div id="empty" class="absolute inset-0 grid place-items-center pointer-events-none">
          <div class="text-center">
            <p class="text-neutral-600">사진 · 영상을 끌어다 놓거나 붙여넣기 (⌘V)</p>
            <p class="text-neutral-9000 mt-1 text-[11px]">빈 장으로 글부터 써도 됩니다 · 3:4 · 1080 × 1440</p>
          </div>
        </div>
        <div id="dropHint" class="absolute inset-3 rounded border border-brand-400/40 bg-brand-400/5 hidden pointer-events-none"></div>
      </div>

      <!-- card strip -->
      <div class="border-t border-neutral-200 shrink-0">
        <div id="strip" class="flex items-stretch gap-2 px-3 py-2.5 overflow-x-auto"></div>
      </div>

      <!-- block toolbar -->
      <div class="border-t border-neutral-200 shrink-0">
        <div id="toolbar" class="flex items-stretch overflow-x-auto"></div>
      </div>
    </section>

    <!-- right property panel -->
    <aside id="propPane" class="hidden lg:block w-[292px] shrink-0 border-l border-neutral-200 pane"></aside>
  </div>

  <!-- phone: property sheet + tabs -->
  <div id="sheet" class="lg:hidden shrink-0 border-t border-neutral-200 off">
    <div id="sheetBody" class="pane max-h-[44vh]"></div>
  </div>
  <nav id="mtabs" class="lg:hidden shrink-0 border-t border-neutral-200 flex items-stretch" style="padding-bottom:env(safe-area-inset-bottom)"></nav>
</div>

<!-- font picker popover -->
<div id="faceMenu" class="fixed z-40 hidden w-[228px] max-h-[52vh] pane rounded-xl bg-white border border-neutral-200 py-1 shadow-2xl"></div>

<!-- ask() dialog: the browser's own prompt/confirm are blocked on a phone and by automation -->
<div id="dlg" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-white/30" data-dlg-cancel></div>
  <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 mx-auto max-w-[380px] rounded-xl bg-white border border-neutral-200 shadow-xl p-4">
    <p id="dlgTitle" class="text-neutral-900 mb-1"></p>
    <p id="dlgNote" class="text-neutral-9000 text-[11px] mb-3"></p>
    <input id="dlgInput" class="w-full bg-neutral-100 rounded-lg px-3 py-2 text-xs text-neutral-900 placeholder:text-neutral-600 outline-none focus:bg-neutral-200 off">
    <textarea id="dlgArea" rows="8" class="w-full bg-neutral-100 rounded-lg px-3 py-2 text-xs text-neutral-900 placeholder:text-neutral-600 outline-none focus:bg-neutral-200 resize-none off"></textarea>
    <div class="flex items-center justify-end gap-1.5 mt-3">
      <button id="dlgCancel" class="seg px-3 rounded-full bg-neutral-100 hover:bg-neutral-200 text-neutral-600">취소</button>
      <button id="dlgOk" class="seg px-4 rounded-full bg-neutral-200 hover:bg-neutral-300">확인</button>
    </div>
  </div>
</div>

<!-- phone: the left rail has nowhere to live, so it comes in as a sheet -->
<div id="leftSheet" class="lg:hidden fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-white/30" data-left-close></div>
  <div class="absolute inset-y-0 left-0 w-[86%] max-w-[320px] bg-white border-r border-neutral-200 shadow-xl flex flex-col">
    <div class="flex items-center justify-between h-12 px-3 border-b border-neutral-200 shrink-0">
      <div id="leftSheetTabs" class="flex items-center gap-1 overflow-x-auto"></div>
      <button class="size-7 shrink-0 grid place-items-center rounded-full hover:bg-neutral-200" data-ic="xmark" data-tone="icon" data-left-close></button>
    </div>
    <div id="leftSheetBody" class="pane flex-1"></div>
  </div>
</div>

/* iphone safari hands back an empty or unfamiliar type for anything that did
   not come straight out of the photo picker, so fall back to the file name */
const IMAGE_EXT = /\.(jpe?g|png|gif|webp|avif|heic|heif|bmp|tiff?)$/i;
const VIDEO_EXT = /\.(mp4|mov|m4v|webm|3gp|avi|mkv|hevc)$/i;
function kindOf(file) {
  const t = file.type || '';
  if (t.startsWith('image/')) return 'image';
  if (t.startsWith('video/')) return 'video';
  const n = file.name || '';
  if (IMAGE_EXT.test(n)) return 'image';
  if (VIDEO_EXT.test(n)) return 'video';
  return '';

/* three things conspire to soften an export: the shrink on the way in, the
   smoothing while drawing, and the export scale. this is the first of them —
   a landscape photo is stretched to fill 1440 of height, so 1620 is not enough. */
const SHRINK_MAX = 2560, SHRINK_Q = 0.94;
async function shrinkImage(file) {
  if (kindOf(file) !== 'image' || typeof createImageBitmap !== 'function') return file;
  try {
    const bmp = await createImageBitmap(file);
    const long = Math.max(bmp.width, bmp.height);
    if (long <= SHRINK_MAX) { bmp.close?.(); return file; }
    const s = SHRINK_MAX / long;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close?.();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', SHRINK_Q));
    return blob ? new File([blob], (file.name || 'photo') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch (_) { return file; }
}

function loadMedia(file, bid = newBid()) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const done = m => resolve(m && { ...m, blob: file, bid });
    if (kindOf(file) === 'video') {
      const el = document.createElement('video');
      el.muted = true; el.playsInline = true; el.preload = 'auto'; el.loop = true;
      const redraw = () => { requestDraw(); requestStrip(); };
      el.addEventListener('seeked', redraw);
      el.addEventListener('loadeddata', redraw);
      let settled = false;
      const finish = ok => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (!ok || !el.videoWidth) return resolve(null);
        if (!el.currentTime) el.currentTime = Math.min(0.1, (el.duration || 1) / 10);
        done({ kind: 'video', el, w: el.videoWidth, h: el.videoHeight });
      };
      /* metadata is enough to size the card; waiting on a seek can hang forever */
      el.addEventListener('loadedmetadata', () => finish(true), { once: true });
      el.addEventListener('error', () => finish(false), { once: true });
      const timer = setTimeout(() => finish(!!el.videoWidth), 25000);
      el.src = url;
    } else if (kindOf(file) === 'image') {
      const el = new Image();
      el.onload = () => done({ kind: 'image', el, w: el.naturalWidth, h: el.naturalHeight });
      el.onerror = () => resolve(null);
      el.src = url;
    } else resolve(null);
  });
}

/* ---------- storage ----------

   saved templates; `blobs` holds the files, shared across folders by key. */
const DB_NAME = 'carousel-project';
let dbPromise = null;
function db() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      if (!d.objectStoreNames.contains('doc')) d.createObjectStore('doc');   /* v1, kept for the migration */
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');

    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }).catch(() => null);
  return dbPromise;
}
function idb(store, mode, fn) {
  return db().then(d => {
    if (!d || !d.objectStoreNames.contains(store)) return null;
    return new Promise(res => {
      let out;

      const req = fn(tx.objectStore(store));
      if (req) req.onsuccess = () => { out = req.result; };
      /* a get() for a key that isn't there resolves to undefined, and that is the
         answer — folding it into `true` made a missing template list read as one */
      tx.oncomplete = () => res(req ? out : true);

/* every blob referenced by ANY folder is live. sweeping only the open one

let gcTimer = 0;
function gcBlobs() {
  clearTimeout(gcTimer);

    const keys = await idb('blobs', 'readonly', st => st.getAllKeys());
    if (!Array.isArray(keys)) return;
    const used = new Set();
    for (const f of state.folders) {
      const deck = f.id === state.folderId ? packDeck() : await metaGet('deck:' + f.id);
      for (const c of deck?.cards || []) {

async function unpackDeck(deck) {
  Object.assign(style, DEFAULT_STYLE, deck?.style || {});
  state.cards = [];
  let missing = 0;
  for (const d of deck?.cards || []) {
    const c = newCard(null);
    Object.assign(c, {
      id: d.id || nid(), title: d.title || '', sub: d.sub || '', name: d.name || '',
      titleFmt: d.titleFmt || [], subFmt: d.subFmt || [],
      tSize: d.tSize ?? null, sSize: d.sSize ?? null,
      zoom: d.zoom || 1, ox: d.ox || 0, oy: d.oy || 0,
      texts: (d.texts || []).map(t => ({ ...newBox(), ...t })),
      textPos: d.textPos ?? null, textW: d.textW ?? null,
      hidden: { title: false, sub: false, media: false, ...(d.hidden || {}) },
      pick: d.pick !== false,

    if (d.bid) {
      c.media = await mediaFor(d.bid);
      if (!c.media) missing++;
    }
    for (const o of d.overlays || []) {
      const m = await mediaFor(o.bid);
      if (!m) continue;
      c.overlays.push({
        id: o.id || nid(), bid: o.bid, kind: o.kind || m.kind || 'image',   /* old decks have no kind */
        el: m.el, iw: m.w, ih: m.h, blob: m.blob,
        cx: o.cx, cy: o.cy, w: o.w, rot: o.rot || 0, alpha: o.alpha ?? 1,
        loop: o.loop !== false, muted: o.muted !== false,

    state.cards.push(c);

  state.sel = { kind: 'none', i: -1 };

  return missing;
}

async function openFolder(id) {
  if (state.folderId) { clearTimeout(saveTimer); await saveDeck(); }
  state.folderId = id;
  const missing = await unpackDeck(await metaGet('deck:' + id));
  await metaPut('app', { folderId: id });
  warmFaces(facesInUse());
  fitted = false;
  fitAll();
  refreshAll();
  if (missing) notify(`${missing}장은 사진이 사라져 다시 넣어주세요`);
}

async function newFolder(name) {
  const id = 'f' + nid();
  state.folders.unshift({ id, name, at: Date.now() });
  await metaPut('folders', state.folders);
  await metaPut('deck:' + id, { style: { ...DEFAULT_STYLE }, cards: [], active: 0, savedAt: Date.now() });
  await openFolder(id);
  return id;
}

  return list.map(c => ({
    ...c,
    titleFmt: c.titleFmt.slice(), subFmt: c.subFmt.slice(),
    overlays: c.overlays.map(o => ({ ...o })),
    texts: c.texts.map(t => ({ ...t, fmt: (t.fmt || []).slice() })),
    hidden: { ...c.hidden },

  state.view.x = (b.w - (x1 - x0) * state.view.k) / 2 - x0 * state.view.k;

function syncZoomLabel() { $('btnFit').textContent = Math.round(state.view.k * 100) + '%'; }

let rafD = 0;

function renderView() {
  const b = stageBox();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  if (view.width !== Math.round(b.w * dpr) || view.height !== Math.round(b.h * dpr)) {
    view.width = Math.round(b.w * dpr); view.height = Math.round(b.h * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  for (const i of visibleCards()) {
    const r = cardRect(i), p = toScreen(r.x, r.y);
    const sw = W * vk, sh = H * vk;
    if (p.x > b.w || p.y > b.h || p.x + sw < 0 || p.y + sh < 0) continue;
    ctx.save();
    ctx.beginPath(); ctx.rect(p.x, p.y, sw, sh); ctx.clip();
    ctx.translate(p.x, p.y);

       this one is drawn on the page, so it is dark — the guides further down

    ctx.strokeStyle = i === state.active ? 'rgba(0,0,0,.32)' : 'rgba(0,0,0,.14)';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x + .5, p.y + .5, sw - 1, sh - 1);

    if (style.showLabels && !style.singleView) {
      ctx.font = '400 11px "Pretendard Variable", sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = i === state.active ? '#171717' : '#a3a3a3';
      ctx.fillText(state.cards[i].name || `카드 ${i + 1}`, p.x, p.y - 8);
    }

  drawChrome(ctx);

/* ---------- editor-only chrome ----------
   drawn in screen space, on top and outside the card clip, because a photo
   bigger than the card puts every one of its handles past the card edge. */
const HANDLE = 9;
function photoRect(c) {

    { n: 'e', x: r.x + r.w, y: r.y + r.h / 2 }, { n: 'se', x: r.x + r.w, y: r.y + r.h },
    { n: 's', x: r.x + r.w / 2, y: r.y + r.h }, { n: 'sw', x: r.x, y: r.y + r.h }, { n: 'w', x: r.x, y: r.y + r.h / 2 },

/* what the current selection puts handles on, in card coordinates */

  if (!c || !h) return null;
  if (state.sel.kind === 'media' && c.media) { const r = photoRect(c); return r && { rect: r, grips: gripsOf(r), mode: 'photo' }; }
  if (state.sel.kind === 'overlay') { const r = h.overlays[state.sel.i]; return r && { rect: r, grips: gripsOf(r), mode: 'overlay' }; }
  if (state.sel.kind === 'text' && h.fixed) { const r = { x: style.padX + textPosOf(c).x, y: h.fixed.y, w: textWOf(c), h: h.fixed.h }; return { rect: r, grips: sideGrips(r), mode: 'fixedW' }; }
  if (state.sel.kind === 'box') { const r = h.texts[state.sel.i]; return r && { rect: r, grips: sideGrips(r), mode: 'boxW' }; }

}
function drawChrome(ctx) {

    ctx.lineWidth = 1;
    const a = S(style.padX, style.padX), b2 = S(W - style.padX, H - style.padX);
    ctx.strokeRect(a.x + .5, a.y + .5, b2.x - a.x, b2.y - a.y);

  if (style.showCenter) {
    ctx.strokeStyle = guide;

view.addEventListener('pointerdown', e => {

    if (inBox(l, h.texts[n])) {

view.addEventListener('pointerdown', e => { if (pointers.size === 1) swipe = { x: e.clientX, y: e.clientY, t: Date.now() }; });

new ResizeObserver(() => {

/* ==========================================================================

let rafS = 0;

function renderStrip() {
  const strip = $('strip');

  const tw = (isTouch || mqPhone.matches) ? 54 : 48, th = Math.round(tw * H / W);
  state.cards.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = `relative shrink-0 rounded overflow-hidden ${i === state.active ? 'ring-1 ring-neutral-400' : 'ring-1 ring-neutral-200 opacity-60 hover:opacity-100'}`;
    const cv = document.createElement('canvas');
    cv.width = 108; cv.height = 144;
    cv.style.display = 'block'; cv.style.width = tw + 'px'; cv.style.height = th + 'px';
    drawCard(cv.getContext('2d'), 108, 144, c, i, state.cards.length, null);
    btn.appendChild(cv);
    btn.addEventListener('click', () => {
      state.active = i; state.sel = { kind: 'none', i: -1 };

    if (!c.pick) {
      const off = document.createElement('span');
      off.className = 'absolute inset-0 bg-white/60';
      btn.appendChild(off);
    }
    const tag = c.media?.kind === 'video' ? '영상' : !c.media ? '글' : '';
    if (tag) {
      const s = document.createElement('span');
      s.className = 'absolute top-1 left-1 px-1 rounded-full bg-neutral-200 text-[9px] text-neutral-900';
      s.textContent = tag;

    }
    if (i === state.active && state.cards.length > 1) {
      const nav = document.createElement('div');
      nav.className = 'absolute inset-x-0 bottom-0 flex justify-between bg-white/30';
      nav.innerHTML = `<span data-m="-1" class="px-1.5 py-0.5 text-neutral-600 hover:text-neutral-900 cursor-pointer">‹</span>
        <span data-m="1" class="px-1.5 py-0.5 text-neutral-600 hover:text-neutral-900 cursor-pointer">›</span>`;
      nav.addEventListener('click', e => {
        const m = e.target.dataset.m; if (!m) return;
        e.stopPropagation();

  add.className = 'shrink-0 rounded grid place-items-center bg-neutral-100 hover:bg-neutral-200';
  add.style.width = tw + 'px'; add.style.height = th + 'px';

function moveCard(from, to) {
  if (to < 0 || to >= state.cards.length) return;

/* ==========================================================================

  CTL[id] = { label, min, max, step, get, set, unit };
}
function defSeg(id, opts, get, set, cast = String) { SEG[id] = { opts, get, set, cast }; }

function hSlider(id) {

  const v = c.get();

    <div class="flex items-center justify-between mb-1.5">
      <span class="text-neutral-9000">${esc(c.label)}</span>
      <span class="font-mono text-[11px] text-neutral-600" data-out="${id}">${fmtVal(c, v)}</span>
    </div>

const fmtVal = (c, v) => (Math.round(v * 100) / 100) + c.unit;

function hSeg(id, cls = '') {

  const v = String(s.get());
  return `<div class="inline-flex seg items-center rounded-full bg-neutral-100 ${cls}">` + s.opts.map(([val, lab]) => {
    const on = String(val) === v;
    return `<button data-seg="${id}" data-val="${esc(val)}" class="seg px-2.5 rounded-full whitespace-nowrap ${on ? 'bg-neutral-200 text-neutral-900' : 'text-neutral-9000 hover:text-neutral-600'}">${lab}</button>`;

}
function hSwitch(id, label) {
  const s = SEG[id];
  const on = bool(s.get());

function hiddenInput(accept, multiple, onPick) {
  const el = document.createElement('input');
  el.type = 'file'; el.accept = accept; el.multiple = multiple; el.className = 'hidden';
  document.body.appendChild(el);
  /* clear only after the files are read: safari can release a picked entry the
     moment the input resets, and a decode still running comes back empty */
  el.addEventListener('change', async e => { try { await onPick([...e.target.files]); } finally { e.target.value = ''; } });
  return el;
}
const pickAny = hiddenInput('image/*,video/*', true, f => addFiles(f));
const pickImage = hiddenInput('image/*', true, f => addFiles(f));
const pickVideo = hiddenInput('video/*', true, f => addFiles(f));

async function readMedia(file) {
  const shrunk = await shrinkImage(file);
  const m = await loadMedia(shrunk);
  if (m) { keepStorage(); await putBlob(m.bid, m.blob); mediaCache.set(m.bid, m); }
  return m;
}

/* files land in the text-only cards first, in order, so the copy can be
   written up front and the photos dropped in one go */
async function addFiles(files) {
  const list = files.filter(f => kindOf(f));
  if (!list.length) { if (files.length) notify(`넣을 수 없는 형식입니다 · ${files[0].type || files[0].name || '알 수 없음'}`); return; }
  const ok = [], bad = [];
  /* one at a time: a phone can only decode a couple of clips at once */
  for (const f of list) { const m = await readMedia(f); if (m) ok.push(m); else bad.push(f); }
  if (bad.length) notify(`${bad.length}개를 열지 못했습니다 · ${bad[0].type || bad[0].name || '알 수 없음'}`);
  if (!ok.length) return;
  pushHistory();
  let first = -1;
  for (const m of ok) {
    const slot = state.cards.findIndex(c => !c.media);
    if (slot >= 0) { const c = state.cards[slot]; c.media = m; c.zoom = 1; c.ox = 0; c.oy = 0; }
    else state.cards.push(newCard(m));
    if (first < 0) first = slot >= 0 ? slot : state.cards.length - 1;
  }
  state.active = clamp(first, 0, state.cards.length - 1);
  select('media', -1);
  if (style.singleView) fitAll();
  refreshAll();
}
async function replaceBg(file) {
  if (!file) return;
  const m = await readMedia(file);
  if (!m) return notify(`열지 못하는 형식입니다 · ${file.type || file.name || '알 수 없음'}`);
  pushHistory();
  let c = cur();
  if (!c) { c = newCard(null); state.cards.push(c); state.active = state.cards.length - 1; }
  c.media = m; c.zoom = 1; c.ox = 0; c.oy = 0;
  refreshAll();
}
async function addOverlays(files) {
  const c = cur(); if (!c || !files.length) return;
  pushHistory();
  for (const f of files) {
    const m = await readMedia(f);
    if (!m) { notify(`열지 못하는 형식입니다 · ${f.type || f.name || '알 수 없음'}`); continue; }
    c.overlays.push({ id: nid(), bid: m.bid, kind: m.kind, el: m.el, iw: m.w, ih: m.h, blob: m.blob,
      cx: W / 2, cy: H / 2, w: W * 0.3, rot: 0, alpha: 1, loop: true, muted: true });
  }
  select('overlay', c.overlays.length - 1);
  refreshAll();
}
function addBlank() {
  pushHistory();
  const c = newCard(null);
  state.cards.splice(state.active + 1, 0, c);

  select('text', -1);
  if (style.singleView) fitAll();

  setTimeout(() => document.querySelector('[data-txt="title"]')?.focus(), 30);
}

async function bulkFill() {
  const text = await ask({ title: '여러 장 한번에', note: '빈 줄로 장을 나눕니다 · 덩어리의 첫 줄이 제목, 나머지가 부제', kind: 'area', ok: '채우기', placeholder: '첫 장 제목\n첫 장 부제\n\n둘째 장 제목\n둘째 장 부제' });
  if (text == null) return;
  const blocks = text.split(/\n\s*\n/).map(b => b.replace(/\s+$/, '')).filter(b => b.trim()).map(b => {
    const [head, ...rest] = b.split('\n');
    return { title: head.trim(), sub: rest.join('\n').trim() };
  });
  if (!blocks.length) return notify('붙여넣은 글이 없습니다');
  pushHistory();
  blocks.forEach((b, i) => {
    if (!state.cards[i]) state.cards.push(newCard(null));
    const c = state.cards[i];
    c.title = b.title; c.sub = b.sub; c.titleFmt = []; c.subFmt = [];
  });
  state.active = 0;
  if (style.singleView) fitAll();
  refreshAll();
  notify(`${blocks.length}장에 글을 채웠습니다`);
}

/* ---------- video playback on the canvas ---------- */
function onFrame(el, fn) {
  /* rAF is throttled in a background tab and samples the video instead of
     following it; the decoded-frame callback stays in step */
  if (el.requestVideoFrameCallback) return el.requestVideoFrameCallback(() => fn());
  return requestAnimationFrame(() => fn());
}
function livePlayers() {
  const out = [];
  const c = cur(); if (!c) return out;
  if (c.media?.kind === 'video' && !c.media.el.paused && !c.media.el.ended) out.push(c.media.el);
  c.overlays.forEach(o => { if (o.kind === 'video' && !o.el.paused && !o.el.ended) out.push(o.el); });
  return out;
}
let videoRaf = 0;
function startVideoLoop() {
  if (videoRaf) return;
  const tick = () => {
    const live = livePlayers();
    if (!live.length) { videoRaf = 0; return; }
    renderView();
    videoRaf = onFrame(live[0], tick) || 1;
  };
  videoRaf = onFrame(livePlayers()[0] || document.createElement('video'), tick) || 1;
}
function pauseVideos(except) {
  state.cards.forEach(c => {
    if (c.media?.kind === 'video' && c.media.el !== except) c.media.el.pause();
    c.overlays.forEach(o => { if (o.kind === 'video' && o.el !== except) o.el.pause(); });
  });
}

/* ==========================================================================
   작업 백업 — 폴더를 사진·영상까지 통째로 파일 하나로
   주소가 바뀌면 브라우저 저장소는 새로 시작하므로, 옮기려면 이 길뿐이다.
   압축 없는(stored) zip 을 손으로 쓴다: 사진이 이미 jpeg 라 압축해봐야 안 줄고,
   이렇게 두면 파인더에서 열어 사진만 꺼낼 수도 있다.
   ========================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const utf8 = s => new TextEncoder().encode(s);

/* zip wants MS-DOS time; the exact minute does not matter, only that it is legal */
function dosTime(d = new Date()) {
  return {
    t: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() / 2)) & 0xFFFF,
    d: (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF,
  };
}
function zipBuild(entries) {
  const { t, d } = dosTime();
  const parts = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const name = utf8(e.name);
    const crc = crc32(e.bytes);
    const size = e.bytes.length;
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);      /* 이름이 UTF-8 이라고 알려준다 */
    local.setUint16(8, 0, true);           /* stored */
    local.setUint16(10, t, true); local.setUint16(12, d, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, size, true); local.setUint32(22, size, true);
    local.setUint16(26, name.length, true); local.setUint16(28, 0, true);
    parts.push(local.buffer, name, e.bytes);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, t, true); cd.setUint16(14, d, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, size, true); cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(cd.buffer, name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}
async function zipRead(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const view = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip 이 아닙니다');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const out = new Map();
  for (let n = 0; n < count; n++) {
    if (view.getUint32(p, true) !== 0x02014b50) throw new Error('목록이 깨졌습니다');
    const method = view.getUint16(p + 10, true);
    const size = view.getUint32(p + 24, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const cmtLen = view.getUint16(p + 32, true);
    const at = view.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    if (method !== 0) throw new Error('압축된 zip 은 읽지 못합니다');
    const lnLen = view.getUint16(at + 26, true), leLen = view.getUint16(at + 28, true);
    const start = at + 30 + lnLen + leLen;
    out.set(name, buf.subarray(start, start + size));
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

/* 확장자를 붙여둬야 파인더에서 눌렀을 때 사진으로 열린다 */
const EXT = { 'image/jpeg':'.jpg', 'image/png':'.png', 'image/webp':'.webp', 'image/gif':'.gif',
  'video/mp4':'.mp4', 'video/quicktime':'.mov', 'video/webm':'.webm' };
function extOf(blob) {
  if (EXT[blob.type]) return EXT[blob.type];
  const m = /(\.[a-z0-9]{2,5})$/i.exec(blob.name || '');
  return m ? m[1].toLowerCase() : '';
}
const humanSize = n => n > 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
const stamp = () => { const d = new Date(), p = x => String(x).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`; };

/* the open folder is only in memory until it is saved, so flush it first */
async function backup(ids) {
  if (busy) return;
  setBusy(true, '백업 준비');
  try {
    clearTimeout(saveTimer);
    await saveDeck();
    const manifest = { kind: 'carousel-backup', v: 1, at: Date.now(), folders: [], blobs: {} };
    const entries = [];
    const seen = new Set();
    let bytes = 0;
    for (const id of ids) {
      const deck = await metaGet('deck:' + id);
      if (!deck) continue;
      manifest.folders.push({ id, name: folderName(id), deck });
      const bids = new Set();
      for (const c of deck.cards || []) {
        if (c.bid) bids.add(c.bid);
        (c.overlays || []).forEach(o => o.bid && bids.add(o.bid));
      }
      for (const bid of bids) {
        if (seen.has(bid)) continue;
        seen.add(bid);
        const blob = await idb('blobs', 'readonly', st => st.get(bid));
        if (!blob) continue;
        const file = `blobs/${bid}${extOf(blob)}`;
        manifest.blobs[bid] = { type: blob.type || '', name: blob.name || '', file };
        entries.push({ name: file, bytes: new Uint8Array(await blob.arrayBuffer()) });
        bytes += blob.size;
        setBusy(true, `백업 ${humanSize(bytes)}`);
      }
    }
    if (!manifest.folders.length) { notify('백업할 폴더가 없습니다'); return; }
    entries.unshift({ name: 'carousel.json', bytes: utf8(JSON.stringify(manifest)) });
    const zip = zipBuild(entries);
    const label = ids.length === 1 ? folderName(ids[0]) : '전체';
    download(zip, `캐러셀-백업-${label}-${stamp()}.zip`);
    notify(`${manifest.folders.length}개 폴더 · 사진 ${seen.size}개 · ${humanSize(zip.size)} 로 저장했습니다`);
  } catch (e) {
    notify('백업하지 못했습니다 · ' + (e?.message || ''));
  } finally { setBusy(false); }
}
defAct('backupOne', () => backup([state.folderId]));
defAct('backupAll', () => backup(state.folders.map(f => f.id)));

/* 가져오기는 늘 새 폴더로 들어간다 — 지금 작업을 덮어쓰는 일은 없다 */
async function restore(file) {
  if (!file || busy) return;
  setBusy(true, '가져오는 중');
  try {
    const files = await zipRead(file);
    const raw = files.get('carousel.json');
    if (!raw) throw new Error('캐러셀 백업 파일이 아닙니다');
    const man = JSON.parse(new TextDecoder().decode(raw));
    if (man.kind !== 'carousel-backup') throw new Error('캐러셀 백업 파일이 아닙니다');

    keepStorage();
    for (const [bid, meta] of Object.entries(man.blobs || {})) {
      const bytes = files.get(meta.file || 'blobs/' + bid);
      if (!bytes) continue;
      /* 이름을 살려둬야 확장자로 종류를 알아낼 수 있다 (아이폰은 type 이 빌 때가 있다) */
      await putBlob(bid, new File([bytes], meta.name || bid, { type: meta.type || '' }));
    }
    let first = null;
    for (const f of man.folders || []) {
      const id = 'f' + nid();
      const name = uniqueName(f.name || '가져온 작업', state.folders.map(x => x.name));
      state.folders.unshift({ id, name, at: Date.now() });
      await metaPut('deck:' + id, f.deck);
      if (!first) first = id;
    }
    await metaPut('folders', state.folders);
    if (first) await openFolder(first);
    notify(`폴더 ${man.folders.length}개를 가져왔습니다`);
  } catch (e) {
    notify('가져오지 못했습니다 · ' + (e?.message || ''));
  } finally { setBusy(false); renderLeft(); }
}
const pickZip = hiddenInput('.zip,application/zip', false, f => restore(f[0]));

/* ==========================================================================
   export
   the same drawCard() runs at 1080 or 2160 — nothing here knows about the
   on-screen zoom, so the file never inherits it.
   ========================================================================== */
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);   /* safari only follows anchors that are in the document */
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function ensureFonts(c) {
  const txt = (c?.title || '') + (c?.sub || '') + (c?.texts || []).map(t => t.text).join('') + '0123456789/ ';
  const faces = new Set([style.titleFace, style.subFace, ...(c?.texts || []).map(t => t.face).filter(Boolean)]);
  faces.forEach(k => mountFace(k, false));
  try {
    await Promise.all([...faces].flatMap(k => faceOf(k).w.map(w => document.fonts.load(fontStr(k, w, 100), txt))));
  } catch (_) {}
}

/* iphone safari decodes a 12MP photo into an <img> at reduced size to save
   memory, so an export drawn from that element is soft no matter how big the
   canvas is. decode the original file once more just for the export. */
async function hiRes(c) {
  const swaps = [];
  const swap = async (holder, key, blob) => {
    if (!blob || typeof createImageBitmap !== 'function' || kindOf(blob) !== 'image') return;
    try {
      const bmp = await createImageBitmap(blob);
      swaps.push({ holder, key, was: holder[key], bmp });
      holder[key] = bmp;
    } catch (_) {}
  };
  if (c?.media?.kind === 'image') await swap(c.media, 'el', c.media.blob);
  for (const o of c?.overlays || []) if (o.kind !== 'video') await swap(o, 'el', o.blob);
  return () => swaps.forEach(x => { x.holder[x.key] = x.was; x.bmp.close?.(); });
}

async function cardFile(i) {
  const c = state.cards[i];
  await ensureFonts(c);
  const scale = style.exportScale || 1;
  const w = W * scale, h = H * scale;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const restore = await hiRes(c);
  try { drawCard(cv.getContext('2d'), w, h, c, i, state.cards.length, null); } finally { restore(); }

  /* a photo card goes out as jpeg: png at this size runs to tens of megabytes
     and a whole deck of them is more than the share sheet will carry. a card
     that is only text on flat black stays png, where jpeg would ring. */
  const [type, ext, q] = c.media ? ['image/jpeg', 'jpg', 0.95] : ['image/png', 'png', undefined];
  let blob = await new Promise(r => cv.toBlob(r, type, q));
  if (!blob) {                      /* out of memory at 2× — fall back to 1× */
    cv.width = W; cv.height = H;
    drawCard(cv.getContext('2d'), W, H, c, i, state.cards.length, null);
    blob = await new Promise(r => cv.toBlob(r, type, q));
  }
  return new File([blob], `${folderName()}-${String(i + 1).padStart(2, '0')}.${ext}`, { type });
}

/* on a phone the share sheet reaches the photo library, which a download does
   not — and the whole batch goes through one sheet, not one per card. */
async function shareOrDownload(files) {
  const phone = mqPhone.matches || isTouch;
  try {
    if (phone && navigator.canShare?.({ files })) { await navigator.share({ files }); return 'shared'; }
  } catch (e) { if (e?.name === 'AbortError') return 'cancelled'; }
  files.forEach(f => download(f, f.name));
  return 'downloaded';
}

function canRecord() {
  return typeof MediaRecorder !== 'undefined'
    && typeof HTMLCanvasElement.prototype.captureStream === 'function'
    && ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'].some(t => { try { return MediaRecorder.isTypeSupported(t); } catch (_) { return false; } });
}
/* records the composited canvas in real time, so it takes as long as the clip */
async function exportVideo(i, onProgress) {
  const c = state.cards[i], m = c.media;
  await ensureFonts(c);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;                 /* 1080 fixed: encoders choke above it */
  const ctx = cv.getContext('2d');
  const stream = cv.captureStream(30);
  try {
    const audio = m.el.captureStream?.() || m.el.mozCaptureStream?.();
    const track = audio?.getAudioTracks?.()[0];
    if (track) stream.addTrack(track);
  } catch (_) {}
  const mime = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  const wasLoop = m.el.loop, wasMuted = m.el.muted;
  m.el.loop = false; m.el.pause(); m.el.currentTime = 0;
  await new Promise(r => m.el.addEventListener('seeked', r, { once: true }));
  const duration = isFinite(m.el.duration) ? m.el.duration : 0;
  rec.start();
  await m.el.play();
  let stop;
  const done = new Promise(r => { stop = r; });
  const tick = () => {
    if (m.el.ended || m.el.paused) return stop();
    drawCard(ctx, W, H, c, i, state.cards.length, null);
    onProgress?.(duration ? m.el.currentTime / duration : 0);
    onFrame(m.el, tick);
  };
  m.el.addEventListener('ended', () => stop(), { once: true });
  onFrame(m.el, tick);
  await done;
  drawCard(ctx, W, H, c, i, state.cards.length, null);
  await new Promise(r => setTimeout(r, 120));
  rec.stop();
  await new Promise(r => rec.onstop = r);
  m.el.loop = wasLoop; m.el.muted = wasMuted; m.el.currentTime = 0;
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  await shareOrDownload([new File([new Blob(chunks, { type: mime })], `${folderName()}-${String(i + 1).padStart(2, '0')}.${ext}`, { type: mime })]);
}

let busy = false;
function setBusy(on, label) {
  busy = on;
  $('dlLabel').textContent = label || '다운로드';
  $('btnDownload').classList.toggle('opacity-60', on);
}
async function runExport(list) {
  if (busy) return;
  if (!list.length) return notify('내보낼 장이 없습니다');
  setBusy(true, '준비 중');
  pauseVideos(null);
  try {
    const videos = list.filter(i => state.cards[i].media?.kind === 'video');
    const stills = list.filter(i => state.cards[i].media?.kind !== 'video');
    if (stills.length) {
      const files = [];
      for (let n = 0; n < stills.length; n++) {
        setBusy(true, `준비 중 ${n + 1}/${stills.length}`);
        files.push(await cardFile(stills[n]));
      }
      setBusy(true, '저장하는 중');
      const how = await shareOrDownload(files);
      if (how === 'shared') notify(`${files.length}장을 보냈습니다`);
    }
    for (const i of videos) {
      if (!canRecord()) { notify('이 브라우저는 영상 내보내기를 지원하지 않습니다 · 사진으로 저장했습니다'); await shareOrDownload([await cardFile(i)]); continue; }
      await exportVideo(i, p => setBusy(true, `녹화 ${Math.round(p * 100)}%`));
      await new Promise(r => setTimeout(r, 300));
    }
  } finally { setBusy(false); refreshAll(); }
}
defAct('expOne', () => runExport(state.cards.length ? [state.active] : []));
defAct('expPicked', () => runExport(state.cards.map((c, i) => c.pick !== false ? i : -1).filter(i => i >= 0)));
defAct('expAll', () => runExport(state.cards.map((_, i) => i)));
$('btnDownload').addEventListener('click', () => {
  const picked = state.cards.map((c, i) => c.pick !== false ? i : -1).filter(i => i >= 0);
  runExport(picked.length ? picked : state.cards.map((_, i) => i));
});

/* ---------- animation preview ---------- */
let animRaf = 0;
const ANIM_MS = 1600;
function playPreview() {
  cancelAnimationFrame(animRaf);
  const t0 = performance.now();
  const step = () => {
    const t = (performance.now() - t0) / ANIM_MS;
    anim = { t: Math.min(1, t) };
    renderView();
    if (t < 1) animRaf = requestAnimationFrame(step);
    else { anim = null; requestDraw(); }
  };
  animRaf = requestAnimationFrame(step);
}
defAct('preview', playPreview);
$('btnPreview').addEventListener('click', playPreview);

/* ==========================================================================
   toolbar, view controls, phone tabs
   ========================================================================== */
const TOOLS = [
  ['텍스트', 'text', addTextBox],
  ['사진', 'photo', () => pickImage.click()],
  ['영상', 'video', () => pickVideo.click()],
  ['여러 장', 'grid', bulkFill],
  ['빈 장', 'card', addBlank],
  ['꾸밈', 'sparkles', () => pickOverlay.click()],
];
function renderToolbar() {
  $('toolbar').innerHTML = TOOLS.map(([label, icon], i) =>
    `<button data-tool="${i}" class="flex-1 min-w-[60px] flex flex-col items-center justify-center gap-1 py-2 border-l border-neutral-200 first:border-l-0 hover:bg-neutral-100">
      ${ic(icon)}<span class="text-neutral-600 text-[11px]">${label}</span></button>`).join('');
}
$('toolbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tool]'); if (!b) return;
  TOOLS[parseInt(b.dataset.tool)][2]();
});
function renderViewToggle() { $('viewToggle').outerHTML = hSeg('singleView').replace('<div class', '<div id="viewToggle" class'); }
$('btnZoomIn').addEventListener('click', () => zoomBy(1.25));
$('btnZoomOut').addEventListener('click', () => zoomBy(1 / 1.25));
$('btnFit').addEventListener('click', () => { fitAll(); requestDraw(); });

let sheetOpen = false;
function renderMTabs() {
  const t = propTab();
  $('mtabs').innerHTML = PROP_TABS.map(([k, l]) =>
    `<button data-mtab="${k}" class="flex-1 py-2.5 ${sheetOpen && k === t ? 'text-neutral-900 bg-neutral-100' : 'text-neutral-9000'}">${l}</button>`).join('');
}
$('mtabs').addEventListener('click', e => {
  const b = e.target.closest('[data-mtab]'); if (!b) return;
  const k = b.dataset.mtab;
  if (sheetOpen && propTab() === k) { sheetOpen = false; }
  else { sheetOpen = true; ACT.tab({ dataset: { tab: k } }); }
  syncSheet();
});
function syncSheet() {
  $('sheet').classList.toggle('off', !sheetOpen);
  renderMTabs();
  if (sheetOpen) renderProp(true);
  requestAnimationFrame(() => { fitAll(); requestDraw(); });
}
document.querySelectorAll('[data-left-close]').forEach(el => el.addEventListener('click', () => $('leftSheet').classList.add('hidden')));
$('btnSheetLeft').addEventListener('click', () => { $('leftSheet').classList.remove('hidden'); renderLeft(); });

/* ==========================================================================
   drop, paste, keyboard
   ========================================================================== */
['dragenter', 'dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); $('dropHint').classList.remove('hidden'); }));
['dragleave', 'drop'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); $('dropHint').classList.add('hidden'); }));
stage.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
window.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/') || i.type.startsWith('video/'));
  if (items.length) addFiles(items.map(i => i.getAsFile()).filter(Boolean));
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('dlg').classList.contains('hidden')) return closeAsk(null);
    if (!$('faceMenu').classList.contains('hidden')) return $('faceMenu').classList.add('hidden');
    if (!$('leftSheet').classList.contains('hidden')) return $('leftSheet').classList.add('hidden');
    return select('none', -1);
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    /* leave the browser's own text undo alone while a field has the caret */
    if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft' && state.active > 0) { state.active--; state.sel = { kind: 'none', i: -1 }; if (style.singleView) fitAll(); refreshAll(); }
  if (e.key === 'ArrowRight' && state.active < state.cards.length - 1) { state.active++; state.sel = { kind: 'none', i: -1 }; if (style.singleView) fitAll(); refreshAll(); }
  if (e.key === 'Backspace' || e.key === 'Delete') {
    e.preventDefault();
    if (state.sel.kind === 'overlay') ACT.ovDel();
    else if (state.sel.kind === 'box') ACT.boxDel();
    else deleteCard();
  }
});
$('btnUndo').addEventListener('click', undo);
$('btnRedo').addEventListener('click', redo);

/* ==========================================================================
   refresh
   ========================================================================== */
function syncSubtitle() {
  const n = state.cards.length;
  const blanks = state.cards.filter(c => !c.media).length;
  const t = savedAt ? new Date(savedAt) : null;
  const p = x => String(x).padStart(2, '0');
  $('subTitle').textContent = [
    folderName(),
    `${n}장` + (blanks ? ` · 글만 ${blanks}장` : ''),
    t ? `저장 ${p(t.getHours())}:${p(t.getMinutes())}` : '',
  ].filter(Boolean).join(' · ');
}
function refreshAll() {
  pauseVideos(cur()?.media?.kind === 'video' ? cur().media.el : null);
  syncSubtitle();
  syncHistoryButtons();
  renderProp(true);
  renderLeft();
  renderToolbar();
  renderViewToggle();
  renderMTabs();
  mountIcons();
  requestDraw();
  requestStrip();
  scheduleSave();
}
mqPhone.addEventListener('change', () => { sheetOpen = false; syncSheet(); refreshAll(); fitAll(); });

/* ==========================================================================
   boot
   ========================================================================== */
/* the old build kept one deck in `doc/current` and its look in localStorage.
   fold both into the first folder so nothing written before today is lost. */
async function migrateV1() {
  const old = await idb('doc', 'readonly', st => st.get('current'));
  if (!old?.slides?.length) return null;
  let s = {};
  try { s = JSON.parse(localStorage.getItem('carousel.style') || '{}'); } catch (_) {}
  const st = { ...DEFAULT_STYLE };
  const map = { titleSize:'titleSize', subSize:'subSize', lineHeight:'lineHeight', color:'color', subOpacity:'subOpacity', padX:'padX' };
  for (const [a, b] of Object.entries(map)) if (s[a] != null) st[b] = s[a];
  if (s.weight != null) {
    /* the old build had one weight slider over one family; here each Pretendard
       weight is its own face, so pick the face that matches what was set */
    st.titleWeight = s.weight; st.subWeight = 400;
    st.titleFace = s.weight >= 700 ? 'pre-b' : s.weight >= 500 ? 'pre-m' : 'pre-r';
    st.subFace = 'pre-r';
  }
  if (s.tracking != null) st.letterSpacing = s.tracking;
  if (s.padY != null) st.padBottom = s.padY;
  if (s.scrim != null) st.darken = s.scrim;
  if (s.counter != null) st.showPageNum = s.counter;
  if (s.guide != null) st.showSafe = s.guide;
  st.textShared = !!s.lockText;
  st.textPos = { x: s.tx || 0, y: s.ty || 0 };
  return {
    style: st, active: old.active || 0, savedAt: Date.now(),
    cards: old.slides.map(d => ({
      id: nid(), title: d.l1 || '', sub: d.l2 || '', name: '', titleFmt: [], subFmt: [],
      tSize: null, sSize: null, zoom: d.zoom || 1, ox: d.ox || 0, oy: d.oy || 0,
      bid: d.bid || null,
      overlays: (d.overlays || []).map(o => ({ id: nid(), bid: o.bid || null, kind: 'image', cx: o.cx, cy: o.cy, w: o.w, rot: 0, alpha: o.alpha ?? 1 })),
      texts: [], textPos: { x: d.tx || 0, y: d.ty || 0 }, textW: null,
      hidden: { title: false, sub: false, media: false }, pick: true,
    })),
  };
}

async function boot() {
  mountIcons();
  renderToolbar();
  renderViewToggle();
  renderMTabs();

  const tpls = await metaGet('templates');
  state.templates = Array.isArray(tpls) ? tpls : [];
  let folders = await metaGet('folders');
  if (!Array.isArray(folders) || !folders.length) {
    const migrated = await migrateV1();
    const id = 'f' + nid();
    folders = [{ id, name: migrated ? '내 작업' : '작업 1', at: Date.now() }];
    await metaPut('folders', folders);
    await metaPut('deck:' + id, migrated || { style: { ...DEFAULT_STYLE }, cards: [], active: 0, savedAt: Date.now() });
    if (migrated) notify(`이전 작업 ${migrated.cards.length}장을 '내 작업' 폴더로 옮겼습니다`);
  }
  state.folders = folders;
  const app = await metaGet('app');
  const id = folders.some(f => f.id === app?.folderId) ? app.folderId : folders[0].id;
  state.folderId = id;
  await unpackDeck(await metaGet('deck:' + id));
  warmFaces(facesInUse());

  refreshAll();
  /* fit only once the panels have taken their width — running it before that
     leaves the canvas a few pixels wide and the zoom at 5%. the observer above
     catches the case where this frame never comes (a tab opened in the back). */
  fitAll();
  requestAnimationFrame(() => { fitAll(); requestDraw(); });
  document.fonts.ready.then(() => { requestDraw(); requestStrip(); });
}
boot();

/* offline + home screen icon; harmless where it isn't supported */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); if (state.folderId) metaPut('deck:' + state.folderId, packDeck()); });
</script>
